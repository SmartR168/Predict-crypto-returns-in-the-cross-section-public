<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc"><title id="title">From observations to an evaluated portfolio</title><desc id="desc">Six stages: market observations, point-in-time panel, signal research, portfolio construction, PnL accounting, evaluation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7398ac"/></marker></defs>
<rect width="1280" height="360" rx="18" fill="#f4f7fa"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="41" font-size="13" fill="#577589" letter-spacing="2">THE RESEARCH PIPELINE</text>
<g fill="#ffffff" stroke="#cedbe5"><rect x="38" y="67" width="370" height="110" rx="12"/><rect x="455" y="67" width="370" height="110" rx="12"/><rect x="872" y="67" width="370" height="110" rx="12"/><rect x="872" y="215" width="370" height="110" rx="12"/><rect x="455" y="215" width="370" height="110" rx="12"/></g><rect x="38" y="215" width="370" height="110" rx="12" fill="#102235"/>
<g fill="#1a3b52" font-size="21" font-weight="600"><text x="62" y="111">01  Observe the market</text><text x="479" y="111">02  Build the daily panel</text><text x="896" y="111">03  Research signals</text><text x="896" y="259">04  Construct the portfolio</text><text x="479" y="259">05  Attribute every return</text></g>
<g fill="#657b8c" font-size="16"><text x="62" y="143">Hourly prices, trading activity, funding</text><text x="479" y="143">Complete UTC data, historical eligibility</text><text x="896" y="143">Single factors, IC, Lasso, GBM, GP</text><text x="896" y="291">Balanced legs, risk scaling, hard caps</text><text x="479" y="291">Price, funding, turnover, execution costs</text></g>
<text x="62" y="259" fill="#ffffff" font-size="21" font-weight="600">06  Evaluate out of sample</text><text x="62" y="291" fill="#adc6d7" font-size="16">RankIC, NAV, drawdown, cost sensitivity</text></g>
<g fill="none" stroke="#7398ac" stroke-width="2" marker-end="url(#arrow)"><path d="M412 122H449"/><path d="M829 122H866"/><path d="M1057 183V209"/><path d="M866 270H831"/><path d="M449 270H414"/></g></svg>
